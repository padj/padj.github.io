name: Update citation counts

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch counts from OpenAlex
        run: node .github/scripts/update-citations.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- _data/citations.json)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git commit -m "Update citation counts from OpenAlex"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the Actions token don't always trigger a classic Pages build.
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build"
