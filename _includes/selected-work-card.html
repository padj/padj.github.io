{% comment %}
  One selected-work card. Param: pub (a publications document).
{% endcomment %}
{% assign pub = include.pub %}
<a class="work-card" href="{{ base_path }}{{ pub.url }}">
  <span class="work-card__venue">{{ pub.venue }} · {{ pub.date | date: "%Y" }}</span>
  <span class="work-card__title">{{ pub.title }}</span>
  {% if pub.blurb %}<span class="work-card__blurb">{{ pub.blurb }}</span>{% endif %}
</a>
